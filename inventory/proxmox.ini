# inventory/proxmox.ini — Proxmox infrastructure inventory

[all:vars]
# Ansible connection settings
ansible_connection=local
ansible_python_interpreter=/usr/bin/python3

# GitHub configuration (provide at runtime via -e)
github_runner_github_token={{ vault_github_runner_token | default('') }}
github_runner_github_org=lpasquali
github_runner_github_api_url=https://api.github.com

[proxmox_hosts]
# Define Proxmox nodes here
# Example:
# proxmox01 ansible_host=192.168.1.100 proxmox_node=pve

[runners]
# Deployed runners will be added here dynamically

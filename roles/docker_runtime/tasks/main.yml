# docker_runtime/tasks/main.yml — Install Docker and Docker Compose

---
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install Docker prerequisites
  ansible.builtin.package:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

- name: Add Docker GPG key (Debian)
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/debian/gpg
    state: present
  when: ansible_os_family == "Debian"

- name: Add Docker repository (Debian)
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture }}] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: present
    filename: docker-ce
  when: ansible_os_family == "Debian"

- name: Update APT cache after adding Docker repo
  ansible.builtin.apt:
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install Docker CE
  ansible.builtin.package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
    state: present

- name: Install Docker Compose
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/v{{ docker_runtime_compose_version }}/docker-compose-Linux-{{ 'aarch64' if ansible_architecture == 'aarch64' else 'x86_64' }}"
    dest: /usr/local/bin/docker-compose
    owner: root
    group: root
    mode: "0755"

- name: Create /etc/docker directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Configure Docker daemon.json
  ansible.builtin.copy:
    content: |
      {
        "storage-driver": "{{ docker_runtime_storage_driver }}",
        "log-driver": "{{ docker_runtime_log_driver }}",
        "log-opts": {
          "max-size": "{{ docker_runtime_log_max_size }}",
          "max-file": "{{ docker_runtime_log_max_file }}"
        },
        "userland-proxy": false
      }
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: restart docker

- name: Enable Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: "{{ docker_runtime_start_on_boot }}"
    state: started
    daemon_reload: true

- name: Add runner user to docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true
  when: docker_runtime_add_user_to_docker_group | bool

- name: Verify Docker installation
  ansible.builtin.command:
    cmd: docker --version
  register: docker_version
  changed_when: false

- name: Display Docker version
  ansible.builtin.debug:
    msg: "Docker installed: {{ docker_version.stdout }}"

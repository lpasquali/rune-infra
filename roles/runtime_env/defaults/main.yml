# runtime_env/defaults/main.yml — Programming language runtimes defaults

---
# Python configuration
runtime_env_python_version: "3.12"
runtime_env_python_packages:
  - python3
  - python3-pip
  - python3-venv
  - python3-dev
  - python3-wheel

# Node.js configuration
runtime_env_nodejs_version: "20"
runtime_env_nodejs_install: true

# Additional interpreters
runtime_env_ruby_install: false
runtime_env_go_install: false

# Global pip packages
runtime_env_global_pip_packages:
  - pip
  - setuptools
  - wheel
  - virtualenv

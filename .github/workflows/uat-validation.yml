# .github/workflows/uat-validation.yml — Validate UAT runners and Rune product

name: "UAT Validation"

on:
  workflow_run:
    workflows: ["UAT Deployment"]
    types:
      - completed
  workflow_dispatch:

jobs:
  validate-runners:
    name: Validate Deployed Runners
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate runners
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_RUNNER_TOKEN }}
        run: |
          ansible-playbook playbooks/validate_uat.yml \
            -i inventory/proxmox.ini \
            -e "github_runner_github_token=${GITHUB_TOKEN}" \
            -v

  run-product-tests:
    name: Run Rune Product Tests
    runs-on: [self-hosted, rune-lan]
    needs: validate-runners
    if: success()

    steps:
      - name: Checkout Rune
        uses: actions/checkout@v4
        with:
          repository: lpasquali/rune

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v --cov=rune --cov-report=term-missing

  cleanup:
    name: Cleanup UAT Resources
    runs-on: ubuntu-latest
    if: always()
    needs: [validate-runners, run-product-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean up runners
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_RUNNER_TOKEN }}
        run: |
          ansible-playbook playbooks/cleanup.yml \
            -i inventory/proxmox.ini \
            -e "github_runner_github_token=${GITHUB_TOKEN}" \
            -v
        continue-on-error: true

  status:
    name: UAT Status Check
    runs-on: ubuntu-latest
    needs: [validate-runners, run-product-tests, cleanup]
    if: always()

    steps:
      - name: Determine overall status
        run: |
          if [[ "${{ needs.validate-runners.result }}" == "success" && \
                "${{ needs.run-product-tests.result }}" == "success" && \
                "${{ needs.cleanup.result }}" == "success" ]]; then
            echo "✓ UAT validation passed"
            exit 0
          else
            echo "✗ UAT validation failed"
            exit 1
          fi

# .github/workflows/uat-deploy.yml — Deploy UAT runners

name: "UAT Deployment"

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      runner_count:
        description: "Number of runners to deploy"
        required: false
        default: "2"

concurrency:
  group: uat-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-runners:
    name: Deploy UAT Runners
    runs-on: ubuntu-latest
    outputs:
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
      runner_count: ${{ steps.deploy.outputs.runner_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ansible collection
        run: |
          ansible-galaxy collection install -r requirements.yml

      - name: Deploy runners
        id: deploy
        env:
          GITHUB_RUNNER_TOKEN: ${{ secrets.GITHUB_RUNNER_TOKEN }}
          RUNNER_COUNT: ${{ inputs.runner_count || '2' }}
        run: |
          ansible-playbook playbooks/deploy_runners.yml \
            -i inventory/proxmox.ini \
            -e "runner_count=${RUNNER_COUNT}" \
            -e "github_runner_github_token=${GITHUB_RUNNER_TOKEN}" \
            -v

      - name: Upload deployment manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest
          path: playbooks/deployment-manifest-*.json
          retention-days: 7

  wait-for-runners:
    name: Wait for Runners to Come Online
    runs-on: ubuntu-latest
    needs: deploy-runners
    timeout-minutes: 10

    steps:
      - name: Wait for runners to register
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_RUNNER_TOKEN }}
        run: |
          echo "Waiting for runners to register with GitHub..."
          for i in {1..24}; do
            REGISTERED=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/orgs/lpasquali/actions/runners" \
              | jq '.runners | length')
            echo "Attempt $i: $REGISTERED runners registered"
            if [ "$REGISTERED" -ge 2 ]; then
              echo "Runners registered successfully"
              exit 0
            fi
            sleep 10
          done
          echo "Timeout waiting for runners to register"
          exit 1

      - name: Wait for runners to come online
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_RUNNER_TOKEN }}
        run: |
          echo "Waiting for runners to come online..."
          for i in {1..24}; do
            ONLINE=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/orgs/lpasquali/actions/runners" \
              | jq '[.runners[] | select(.status == "online")] | length')
            echo "Attempt $i: $ONLINE runners online"
            if [ "$ONLINE" -ge 2 ]; then
              echo "Runners online"
              exit 0
            fi
            sleep 10
          done
          echo "Timeout waiting for runners to come online"
          exit 1
